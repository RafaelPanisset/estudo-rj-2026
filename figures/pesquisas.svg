<text x="30" y="930" font-size="14">Eixo por onda, com o mesmo espaçamento: não é proporcional aos dias e não é probabilidade de vitória. Séries separadas.</text>
<text x="30" y="952" font-size="14">Data sem asterisco: fim de campo na ficha. Asterisco: rótulo do documento, sem período de campo confirmado. Entre parênteses: rótulo do gráfico quando a ficha traz outra data.</text>
<text x="30" y="974" font-size="14">Quaest e Real Time Big Data ficam fora do desenho. A Quaest é fonte secundária e os válidos são modelo de eleitor provável. A Atlas de 3/10 é republicação, não o original do instituto.</text></g></svg>